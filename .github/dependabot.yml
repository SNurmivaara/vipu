# Weekly grouped version updates. Security updates are configured separately in
# the repository settings. Base images are not tracked here: Dependabot would
# propose Python and Node major upgrades through the image tags. The monthly
# dependency report (.github/workflows/dependency-report.yml) tracks them instead.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /mcp-server
    schedule:
      interval: weekly
    groups:
      mcp-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    # @types/node follows the Node runtime major, which moves by hand together
    # with the Node pins; the dependency report flags a mismatch.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the codebase changed
  changes:
    name: Detect Changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'test.sh'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'test.sh'
            mcp:
              - 'mcp-server/**'
              # The MCP tests run against the real Flask app, so a backend
              # change can break them without touching mcp-server/.
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'test.sh'

  # Backend: Lint + Typecheck
  backend-lint:
    name: Backend Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting with Black
        run: uv run --locked black --check .

      - name: Lint with Ruff
        run: uv run --locked ruff check .

      - name: Type check with mypy
        run: uv run --locked mypy .

  # Backend: Tests
  backend-test:
    name: Backend Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests with coverage
        env:
            TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run --locked pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # MCP server: Lint + Typecheck
  mcp-lint:
    name: MCP Lint
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting with Black
        run: uv run --locked black --check .

      - name: Lint with Ruff
        run: uv run --locked ruff check .

      - name: Type check with mypy
        run: uv run --locked mypy .

  # MCP server: Tests
  mcp-test:
    name: MCP Test
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests with coverage
        run: uv run --locked pytest --cov=vipu_mcp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: mcp-server/coverage.xml
          flags: mcp
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Frontend: Lint + Typecheck
  frontend-lint:
    name: Frontend Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  # Frontend: Build
  frontend-build:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Docker: Build and integration test (always runs)
  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: vipu-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: vipu-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MCP image
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-server
          push: false
          tags: vipu-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create .env file
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env
          echo "POSTGRES_PASSWORD=test-password-for-ci" >> .env
          echo "MCP_AUTH_TOKEN=test-mcp-token-for-ci" >> .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:5000/api/health | grep -q "ok"; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 2
          done
          echo "Backend failed to start"
          docker compose logs
          exit 1

      - name: Test health endpoint
        run: |
          response=$(curl -s http://localhost:5000/api/health)
          echo "Health response: $response"
          echo "$response" | grep -q "ok"

      - name: Verify PostgreSQL migrations
        run: docker compose exec -T backend python < scripts/check-migrations.py

      - name: Wait for MCP server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5100/health | grep -q "ok"; then
              echo "MCP server is ready!"
              exit 0
            fi
            echo "Attempt $i: MCP server not ready yet..."
            sleep 2
          done
          echo "MCP server failed to start"
          docker compose logs mcp
          exit 1

      - name: Test MCP endpoint is gated
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:5100/mcp -H "Content-Type: application/json" -d "{}")
          echo "Unauthenticated /mcp status: $status"
          [ "$status" = "401" ]

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop services
        if: always()
        run: docker compose down -v

  # Final status check - always runs and reports success only if required jobs passed
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, backend-lint, backend-test, mcp-lint, mcp-test, frontend-lint, frontend-build, docker]
    if: always()
    steps:
      - name: Check CI status
        run: |
          # Failed or cancelled detection must never produce a green gate
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection did not succeed"
            exit 1
          fi

          # Docker must always pass
          if [[ "${{ needs.docker.result }}" != "success" ]]; then
            echo "Docker build/test failed"
            exit 1
          fi

          # Backend jobs must pass if backend changed
          if [[ "${{ needs.changes.outputs.backend }}" == "true" ]]; then
            if [[ "${{ needs.backend-lint.result }}" != "success" ]]; then
              echo "Backend lint failed"
              exit 1
            fi
            if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
              echo "Backend test failed"
              exit 1
            fi
          fi

          # MCP jobs must pass if the MCP server or the backend changed
          if [[ "${{ needs.changes.outputs.mcp }}" == "true" ]]; then
            if [[ "${{ needs.mcp-lint.result }}" != "success" ]]; then
              echo "MCP lint failed"
              exit 1
            fi
            if [[ "${{ needs.mcp-test.result }}" != "success" ]]; then
              echo "MCP test failed"
              exit 1
            fi
          fi

          # Frontend jobs must pass if frontend changed
          if [[ "${{ needs.changes.outputs.frontend }}" == "true" ]]; then
            if [[ "${{ needs.frontend-lint.result }}" != "success" ]]; then
              echo "Frontend lint failed"
              exit 1
            fi
            if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
              echo "Frontend build failed"
              exit 1
            fi
          fi

          echo "All required CI checks passed!"

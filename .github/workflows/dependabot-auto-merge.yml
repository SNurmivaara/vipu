name: Dependabot auto-merge

# Enables auto-merge on Dependabot minor and patch PRs. GitHub then merges them
# once the required "CI Status" check passes; a failing check leaves the PR open.
# This relies on branch protection requiring "CI Status" on main: without it,
# --auto merges immediately.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Grouped PRs report the highest update type in the group, so a group
      # containing a major bump (including a security update) is skipped.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

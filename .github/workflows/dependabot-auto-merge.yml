name: Dependabot auto-merge

# Enables auto-merge on Dependabot minor and patch PRs. GitHub then merges them
# once the required "CI Status" check passes; a failing check leaves the PR open.
# This relies on branch protection requiring "CI Status" on main: without it,
# --auto merges immediately.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Check who opened the PR, not github.actor: the actor is whoever triggered
    # this event, which need not be the PR author.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Grouped PRs report the highest update type in the group, so a group
      # containing a major bump (including a security update) is skipped.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

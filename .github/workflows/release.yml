name: Release images to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build both images (skip change detection)'
        required: false
        default: true
        type: boolean
      tag:
        description: 'Tag to use for images (e.g., v1.0.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous release tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            echo "base=HEAD~100" >> $GITHUB_OUTPUT
          else
            echo "base=$PREV_TAG" >> $GITHUB_OUTPUT
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.prev_tag.outputs.base }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # Backend builds - parallel native builds per architecture
  build-backend-amd64:
    name: Backend (amd64)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || inputs.force_build == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/snurmivaara/vipu-backend:${{ inputs.tag || github.ref_name }}-amd64
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=max,scope=backend-amd64

  build-backend-arm64:
    name: Backend (arm64)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || inputs.force_build == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/snurmivaara/vipu-backend:${{ inputs.tag || github.ref_name }}-arm64
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

  merge-backend-manifest:
    name: Backend Manifest
    needs: [build-backend-amd64, build-backend-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          docker buildx imagetools create -t ghcr.io/snurmivaara/vipu-backend:${TAG} \
            ghcr.io/snurmivaara/vipu-backend:${TAG}-amd64 \
            ghcr.io/snurmivaara/vipu-backend:${TAG}-arm64
          docker buildx imagetools create -t ghcr.io/snurmivaara/vipu-backend:latest \
            ghcr.io/snurmivaara/vipu-backend:${TAG}-amd64 \
            ghcr.io/snurmivaara/vipu-backend:${TAG}-arm64

  # Frontend builds - parallel native builds per architecture
  build-frontend-amd64:
    name: Frontend (amd64)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || inputs.force_build == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/snurmivaara/vipu-frontend:${{ inputs.tag || github.ref_name }}-amd64
          cache-from: type=gha,scope=frontend-amd64
          cache-to: type=gha,mode=max,scope=frontend-amd64

  build-frontend-arm64:
    name: Frontend (arm64)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || inputs.force_build == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/snurmivaara/vipu-frontend:${{ inputs.tag || github.ref_name }}-arm64
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64

  merge-frontend-manifest:
    name: Frontend Manifest
    needs: [build-frontend-amd64, build-frontend-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          docker buildx imagetools create -t ghcr.io/snurmivaara/vipu-frontend:${TAG} \
            ghcr.io/snurmivaara/vipu-frontend:${TAG}-amd64 \
            ghcr.io/snurmivaara/vipu-frontend:${TAG}-arm64
          docker buildx imagetools create -t ghcr.io/snurmivaara/vipu-frontend:latest \
            ghcr.io/snurmivaara/vipu-frontend:${TAG}-amd64 \
            ghcr.io/snurmivaara/vipu-frontend:${TAG}-arm64

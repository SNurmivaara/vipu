          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          docker buildx imagetools create -t "ghcr.io/snurmivaara/vipu-mcp:${TAG}" \
            "ghcr.io/snurmivaara/vipu-mcp:${TAG}-amd64" \
            "ghcr.io/snurmivaara/vipu-mcp:${TAG}-arm64"
          docker buildx imagetools create -t ghcr.io/snurmivaara/vipu-mcp:latest \
            "ghcr.io/snurmivaara/vipu-mcp:${TAG}-amd64" \
            "ghcr.io/snurmivaara/vipu-mcp:${TAG}-arm64"

  # Frontend builds - parallel native builds per architecture
  build-frontend-amd64:
    name: Frontend (amd64)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || inputs.force_build == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./mcp-server
          push: true
          platforms: linux/amd64
          tags: ghcr.io/snurmivaara/vipu-mcp:${{ inputs.tag || github.ref_name }}-amd64
          cache-from: type=gha,scope=mcp-amd64
          cache-to: type=gha,mode=max,scope=mcp-amd64

  build-mcp-arm64:
    name: MCP (arm64)
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || inputs.force_build == true
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./mcp-server
          push: true
          platforms: linux/arm64
          tags: ghcr.io/snurmivaara/vipu-mcp:${{ inputs.tag || github.ref_name }}-arm64
          cache-from: type=gha,scope=mcp-arm64
          cache-to: type=gha,mode=max,scope=mcp-arm64

  merge-mcp-manifest:
    name: MCP Manifest
    needs: [build-mcp-amd64, build-mcp-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR

name: Release images to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build both images (skip change detection)'
        required: false
        default: true
        type: boolean
      tag:
        description: 'Tag to use for images (e.g., v1.0.1)'
        required: true
        type: string

# Only the jobs that push images get packages: write.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every build job needs this one, so a failure here publishes nothing.
      - name: Check the release commit and tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z release tag."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not on main; release only commits from main."
            exit 1
          fi

      - name: Get previous release tag
        id: prev_tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -vxF "$REF_NAME" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            echo "base=HEAD~100" >> "$GITHUB_OUTPUT"
          else
            echo "base=$PREV_TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.prev_tag.outputs.base }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            mcp:
              - 'mcp-server/**'

  # Backend builds - parallel native builds per architecture
  build-backend-amd64:
    name: Backend (amd64)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || inputs.force_build == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/snurmivaara/vipu-backend:${{ inputs.tag || github.ref_name }}-amd64
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=max,scope=backend-amd64

  build-backend-arm64:
    name: Backend (arm64)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || inputs.force_build == true
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/snurmivaara/vipu-backend:${{ inputs.tag || github.ref_name }}-arm64
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

  merge-backend-manifest:
    name: Backend Manifest
    needs: [build-backend-amd64, build-backend-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          docker buildx imagetools create -t "ghcr.io/snurmivaara/vipu-backend:${TAG}" \
            "ghcr.io/snurmivaara/vipu-backend:${TAG}-amd64" \
            "ghcr.io/snurmivaara/vipu-backend:${TAG}-arm64"
          docker buildx imagetools create -t ghcr.io/snurmivaara/vipu-backend:latest \
            "ghcr.io/snurmivaara/vipu-backend:${TAG}-amd64" \
            "ghcr.io/snurmivaara/vipu-backend:${TAG}-arm64"

  # MCP server builds - parallel native builds per architecture
  build-mcp-amd64:
    name: MCP (amd64)
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || inputs.force_build == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:

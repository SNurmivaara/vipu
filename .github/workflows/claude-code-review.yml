name: Claude Code Review

on:
  pull_request:
    # Review once per PR, not on every push, to stay within subscription limits.
    # Comment "@claude review" on the PR for another pass.
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Dependabot and fork PRs do not receive the OAuth secret. CI runs only on PRs
    # into main, so a PR stacked on another branch would wait the full deadline
    # for a CI Status that never comes: skip it. After retargeting to main, close
    # and reopen the PR (or push to it and comment "@claude review").
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: write # The summary comment is posted with the workflow token.
      issues: read
      checks: read
      actions: read
      id-token: write

    steps:
      # Review code that CI has tested. Waiting costs runner time, not subscription
      # quota. On a claude/ branch a failure may be followed by a fix from
      # claude-ci-fix.yml, so follow the PR head until CI passes or time runs out.
      - name: Wait for CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          deadline=$(( $(date +%s) + 50 * 60 ))
          while :; do
            sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
            result=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=CI%20Status" \
              --jq '.check_runs[0] | select(.status == "completed") | .conclusion')
            if [[ "$result" == success ]] || (( $(date +%s) > deadline )); then
              break
            fi
            if [[ -n "$result" && "$BRANCH" != claude/* ]]; then
              break
            fi
            sleep 30
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "result=${result:-not finished}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ci.outputs.sha }}
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude opens its own PRs; the action otherwise refuses bot-triggered runs.
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD: ${{ steps.ci.outputs.sha }}
            CI STATUS ON HEAD: ${{ steps.ci.outputs.result }}

            Review this pull request against AGENTS.md and the issue it closes.

            1. Read the PR body and the linked issue (gh issue view). For each
               acceptance criterion, find the test or check that proves it. A
               criterion without evidence is a finding even when the code looks right.
            2. If CI did not succeed, read the failed logs (gh run list, then
               gh run view --log-failed) and report the cause.
            3. Look for correctness bugs, financial calculation and migration risks,
               and missing regression tests.

            Post each concrete issue as an inline comment with
            mcp__github_inline_comment__create_inline_comment. Do not post a summary
            comment yourself: return it as `body` in the structured output, without a
            heading, and the workflow posts it. The body covers the CI result, each
            acceptance criterion marked covered (naming its test or check) or
            missing, and the findings, or "No issues found" if there are none.
            Report what you found, not the checks you did not run.

            Set `verdict` to REQUEST_CHANGES when CI did not succeed, an acceptance
            criterion has no evidence, or a finding should be fixed before merging.
            Otherwise set it to APPROVE; minor notes can go in the body.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh run list:*),Bash(gh run view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"body":{"type":"string"}},"required":["verdict","body"]}'

      # The heading comes from the schema-checked verdict, so every summary starts
      # with "REVIEW: APPROVE" or "REVIEW: REQUEST CHANGES" for skimming. It is a
      # plain comment, not a GitHub review approval; only CI Status gates merging.
      - name: Post the review summary
        # Empty when the action skips itself, e.g. on a PR that edits this file.
        if: steps.claude-review.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          case "$(jq -r '.verdict // empty' <<< "$OUTPUT")" in
            APPROVE) heading="REVIEW: APPROVE" ;;
            REQUEST_CHANGES) heading="REVIEW: REQUEST CHANGES" ;;
            *) echo "::error::The review returned no verdict."; exit 1 ;;
          esac
          { printf '## %s\n\n' "$heading"; jq -r '.body' <<< "$OUTPUT"; } > "$RUNNER_TEMP/review.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/review.md"

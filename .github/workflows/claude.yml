name: Claude Code

# Only comments and reviews start a run. Issue bodies are specifications that may
# mention @claude in passing, so opening or assigning an issue never does.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Bots never start a run, so Claude's own comments mentioning @claude are
    # ignored. The action also rejects actors without write access.
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Match the CI toolchain so Claude can run the checks AGENTS.md requires.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          (cd backend && uv sync --locked --extra dev)
          (cd mcp-server && uv sync --locked --extra dev)
          (cd frontend && npm ci)

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # ./scripts/test-docker.sh takes several minutes; let one Bash call wait for it.
          settings: |
            {"env": {"BASH_DEFAULT_TIMEOUT_MS": "900000", "BASH_MAX_TIMEOUT_MS": "1800000"}}
          # uv run already allows arbitrary code, so a narrow list only blocks
          # verification. Write access and branch protection are the boundary.
          # The appended prompt replaces the action's default of posting a
          # "Create PR" link with a signature: the implement-issue skill opens the PR.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Bash(./test.sh),Bash(./scripts/*),Bash(bash *),Bash(uv *),Bash(npm *),Bash(npx *),Bash(git *),Bash(docker *),Bash(gh pr *),Bash(gh issue view *),Bash(gh run *)"
            --append-system-prompt "This repository runs you in GitHub Actions. For implementation
            requests follow .claude/skills/implement-issue/SKILL.md, including its GitHub Actions
            notes. Its pull request steps replace your default ones: do not post a Create PR link;
            open the pull request yourself with gh pr create, or update an existing one with
            gh pr edit, and add no Generated with Claude Code signature anywhere. Docker works on
            this runner, so run the checks the skill asks for, including ./scripts/test-docker.sh,
            before pushing. If a tool call is denied, name the denied command in your final comment."

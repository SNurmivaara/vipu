[project]
name = "vipu-backend"
version = "0.1.0"
description = "Personal finance tracker backend"
requires-python = ">=3.11"
dependencies = [
    "apiflask>=2.0",
    "flask-cors>=4.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.1",
    "python-dotenv>=1.2.2",
    "gunicorn>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "types-Flask-Cors>=4.0",
]

# Declared so the mcp-server dev extras can take this package as a uv path
# dependency and run its tools against the real Flask app. Without it the build
# falls back to setuptools, which leaves a build/ tree in the source directory
# that then shadows app/ for mypy.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

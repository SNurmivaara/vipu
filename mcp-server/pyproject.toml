[project]
name = "vipu-mcp"
version = "0.1.0"
description = "MCP server for Vipu, the personal finance tracker"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "anyio>=4.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    # The tools are tested against the real Flask app over httpx.WSGITransport,
    # not against mocked JSON. Dev only: the running container talks HTTP.
    "vipu-backend",
]

[tool.uv.sources]
vipu-backend = { path = "../backend" }

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
